<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class 10 Study Material</title>

<style>

.container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:20px;
    margin-top:30px;
}

.pdf-card{
    background:#fff;
    border-radius:15px;
    padding:20px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.pdf-card h3{
    margin-bottom:15px;
    font-size:18px;
}

.buttons{
    display:flex;
    gap:10px;
}

.buttons a{
    text-decoration:none;
    padding:10px 15px;
    border-radius:8px;
    color:white;
    font-weight:bold;
}

.buttons a:first-child{
    background:#2196f3;
}

.buttons a:last-child{
    background:#4caf50;
}
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    background:linear-gradient(135deg,#000,#001f5c,#00b140);
    min-height:100vh;
    padding:30px;
}

h1{
    text-align:center;
    color:white;
    margin-bottom:30px;
}

.container{
    max-width:1200px;
    margin:auto;

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
}

.pdf-card{
    background:rgba(255,255,255,.1);
    backdrop-filter:blur(10px);
    border-radius:20px;
    padding:20px;
    color:white;
    text-align:center;
    border:1px solid rgba(255,255,255,.15);
}

.pdf-card h3{
    margin-bottom:20px;
    font-size:18px;
}

.buttons{
    display:flex;
    gap:10px;
    justify-content:center;
}

.buttons a{
    text-decoration:none;
    color:white;
    padding:10px 18px;
    border-radius:10px;
    background:#0099ff;
    font-weight:bold;
    transition:.3s;
}

.buttons a:hover{
    transform:scale(1.05);
}

.buttons a:last-child{
    background:#00b140;
}
</style>
</head>
<body>

<h1>📚 Class 10 Study Material</h1>

<div class="container" id="pdfContainer"></div>

<script>
const pdfs = [
  {
    file: "10th Emplloyability Skills Notes 2021-22 - Copy.pdf",
    name: "Employability Skills Notes"
  },
  {
    file: "10th IT PAPER 2023 - Copy - Copy (2).pdf",
    name: "Class 10 IT Question Paper 2023"
  },
  {
    file: "10th Notes DDEO.pdf",
    name: "Class 10 Notes – DDEO"
  },
  {
    file: "Chapter 11,12 Class 10 - Copy (2).pdf",
    name: "Chapter 11 & 12 – Class 10"
  },
  {
    file: "Class 10 English Marking Scheme - Copy - Copy (3).pdf",
    name: "English Marking Scheme"
  },
  {
    file: "Class 10 Social Science Marking Schemes - Copy - Copy (3).pdf",
    name: "Social Science Marking Scheme"
  },
  {
    file: "Complete_Sanskrit_1_liner (1) - Copy - Copy.pdf",
    name: "Sanskrit Complete One-Liner"
  },
  {
    file: "Complete_Social Science_10_liner.pdf",
    name: "Social Science Complete One-Liner"
  },
  {
    file: "Complete_Social Science_Formula.pdf",
    name: "Social Science Important Formulas"
  },
  {
    file: "English Grammar Do As Directed - Copy.pdf",
    name: "English Grammar – Do As Directed"
  },
  {
    file: "Keshav Sample Papers 2025, Social science.pdf",
    name: "Social Science Sample Papers 2025"
  },
  {
    file: "One liner Scince - Copy.pdf",
    name: "Science One-Liner"
  },
  {
    file: "Parikshabodh Class 10th Objectives.pdf",
    name: "Parikshabodh – Class 10 Objectives"
  },
  {
    file: "Probability Class 10th - Copy - Copy (2).pdf",
    name: "Probability – Class 10"
  },
  {
    file: "SANSKRIT answersheet - Copy - Copy (2).pdf",
    name: "Sanskrit Answer Sheet"
  },
  {
    file: "SANSKRIT copy - Copy - Copy.pdf",
    name: "Sanskrit Practice Copy"
  },
  {
    file: "SOCIAL SCIENCE copy.pdf",
    name: "Social Science Study Material"
  },
  {
    file: "science - Copy - Copy (3).pdf",
    name: "Science Study Material"
  },
  {
    file: "stats - Copy - Copy (2).pdf",
    name: "Statistics – Class 10"
  },
    {
    file: "50_pH_Values_Hindi_List.pdf",
        name:"PH Velue"
}
];

const container = document.getElementById("pdfContainer");

pdfs.forEach(pdf => {
  const card = document.createElement("div");
  card.className = "pdf-card";

  card.innerHTML = `
    <h3>${pdf.name}</h3>

    <div class="buttons">
      <a href="pdf/${encodeURIComponent(pdf.file)}" target="_blank">
        👁 View
      </a>

      <a href="pdf/${encodeURIComponent(pdf.file)}" download>
        ⬇ Download
      </a>
    </div>
  `;

  container.appendChild(card);
});
</script>
</body>
</html>
